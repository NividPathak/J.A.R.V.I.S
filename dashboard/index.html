<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S — scoreboard</title>
<style>
  /* Light is the base definition; dark redefines only the tokens, so no colour
     has its sole definition inside a media query. */
  :root {
    --surface-0: #f4f4f2;
    --surface-1: #fcfcfb;
    --border:    #e2e1dd;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #86857f;
    /* Status palette — fixed, never themed. Always paired with a text label. */
    --good:     #0ca30c;
    --warning:  #fab219;
    --serious:  #ec835a;
    --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-0: #111110;
      --surface-1: #1a1a19;
      --border:    #2e2e2b;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #8a897f;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #111110; --surface-1: #1a1a19; --border: #2e2e2b;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8a897f;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: var(--surface-0); color: var(--text-primary);
    font: 15px/1.5 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 16px; align-items: baseline;
    justify-content: space-between; margin-bottom: 20px;
  }
  h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
  .meta { color: var(--text-muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  .strip {
    display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 13px; font-size: 13px;
    color: var(--text-secondary);
  }
  .pill strong { color: var(--text-primary); font-weight: 600; }

  .grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
  }
  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 15px 17px;
  }
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 12px;
  }
  .card-head h2 { font-size: 14px; margin: 0; letter-spacing: .04em; text-transform: uppercase; }

  /* Status is colour + word, never colour alone — a dot on its own is
     unreadable for CVD users and meaningless in forced-colors mode. */
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .s-ok      .dot { background: var(--good); }
  .s-stale   .dot { background: var(--warning); }
  .s-failing .dot { background: var(--critical); }
  .s-empty   .dot { background: var(--text-muted); }

  .event { padding: 9px 0; border-top: 1px solid var(--border); }
  .event:first-of-type { border-top: 0; }
  .event-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .badge {
    font-size: 10.5px; font-weight: 700; letter-spacing: .07em;
    padding: 2px 7px; border-radius: 4px; flex: none;
    border: 1px solid currentColor;
  }
  .b-live  { color: var(--good); }
  .b-final { color: var(--text-muted); }
  .b-pre   { color: var(--text-secondary); }

  .teams { margin-top: 5px; display: flex; flex-direction: column; gap: 3px; }
  .team { display: flex; justify-content: space-between; gap: 12px; }
  .team .name { color: var(--text-secondary); }
  .team.won .name { color: var(--text-primary); font-weight: 600; }
  .score { font-variant-numeric: tabular-nums; color: var(--text-primary); font-weight: 600; }
  .when { color: var(--text-muted); font-size: 12.5px; }
  .empty { color: var(--text-muted); font-size: 13.5px; padding: 6px 0; }
  .err { color: var(--critical); font-size: 12.5px; margin-top: 8px; word-break: break-word; }
  footer { margin-top: 22px; color: var(--text-muted); font-size: 12.5px; }
</style>
</head>
<body>
<header>
  <h1>J.A.R.V.I.S — scoreboard</h1>
  <div class="meta" id="meta">loading…</div>
</header>

<div class="strip" id="strip"></div>
<main class="grid" id="grid"></main>
<footer id="footer"></footer>

<script>
const REFRESH_MS = 15000;
const STATE_LABEL = { in: "LIVE", post: "FINAL", pre: "UPCOMING" };
const HEALTH_LABEL = { ok: "live data", stale: "stale", failing: "failing", empty: "no data" };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const ago = s => s == null ? "never"
  : s < 60 ? `${s}s ago`
  : s < 3600 ? `${Math.round(s / 60)}m ago`
  : `${Math.round(s / 3600)}h ago`;

function statusEl(health, age) {
  const label = HEALTH_LABEL[health] || health;
  const suffix = health === "ok" || age == null ? "" : ` · ${ago(age)}`;
  return `<span class="status s-${esc(health)}"><span class="dot"></span>${esc(label)}${suffix}</span>`;
}

function eventEl(ev) {
  const state = ev.state || "pre";
  const label = STATE_LABEL[state] || state.toUpperCase();
  const cls = state === "in" ? "b-live" : state === "post" ? "b-final" : "b-pre";
  const teams = (ev.competitors || []).map(c => `
    <div class="team ${c.winner === true || c.winner === "true" ? "won" : ""}">
      <span class="name">${esc(c.name || c.abbr || "?")}</span>
      <span class="score">${c.score == null ? "" : esc(c.score)}</span>
    </div>`).join("");

  return `<div class="event">
    <div class="event-top">
      <span class="when">${esc(ev.detail || "")}</span>
      <span class="badge ${cls}">${esc(label)}</span>
    </div>
    ${teams || `<div class="teams"><div class="team"><span class="name">${esc(ev.name || "")}</span></div></div>`}
  </div>`;
}

function cardEl(sport) {
  const events = (sport.events || []).slice(0, 6);
  const body = events.length
    ? events.map(eventEl).join("")
    : `<div class="empty">Nothing scheduled.</div>`;
  return `<section class="card">
    <div class="card-head">
      <h2>${esc(sport.label)}</h2>
      ${statusEl(sport.health, sport.age_seconds)}
    </div>
    ${body}
    ${sport.error ? `<div class="err">${esc(sport.error)}</div>` : ""}
  </section>`;
}

function stripEl(state) {
  const bits = [];
  const w = state.weather || {};
  if (w.temp != null) {
    bits.push(`<span class="pill"><strong>${esc(w.temp)}&deg;</strong> ${esc(w.condition || "")}</span>`);
  }
  (w.alerts || []).forEach(a =>
    bits.push(`<span class="pill"><span class="dot" style="background:var(--warning)"></span>${esc(a)}</span>`));
  const c = state.calendar || {};
  if (c.next) {
    bits.push(`<span class="pill">Next: <strong>${esc(c.next.title)}</strong></span>`);
  } else if (c.today_count === 0) {
    bits.push(`<span class="pill">Nothing scheduled today</span>`);
  }
  return bits.join("");
}

async function refresh() {
  try {
    const res = await fetch("/api/state", { cache: "no-store" });
    const state = await res.json();
    if (state.error) throw new Error(state.error);

    document.getElementById("strip").innerHTML = stripEl(state);
    document.getElementById("grid").innerHTML = (state.sports || []).map(cardEl).join("");

    const live = (state.sports || []).filter(s => s.live).map(s => s.label);
    document.getElementById("meta").textContent =
      (live.length ? `Live: ${live.join(", ")} · ` : "") +
      `updated ${new Date().toLocaleTimeString()}`;
    document.getElementById("footer").textContent =
      "Reads the local cache; the poller is the only thing that fetches. " +
      `Refreshing every ${REFRESH_MS / 1000}s.`;
  } catch (e) {
    document.getElementById("meta").textContent = `refresh failed: ${e.message}`;
  }
}

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
